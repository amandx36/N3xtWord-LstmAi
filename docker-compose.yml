services:
  frontend:
    build:
      context: ./frontendlstm
      dockerfile: Dockerfile
    container_name: nextword-pred
    ports:
      - "3000:3000"
    env_file:
      - ./frontendlstm/.env
    environment:
      N3xtharBackendUrl: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextword-pred-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/app/.env
    environment:
      # Dockerfile copies the backend package to /app/app, including artifacts.
      MODEL_PATH: /app/app/artifacts/lstm_model.keras
      VOCAB_PATH: /app/app/artifacts/vocabulary.json
    restart: unless-stopped
